name: CI

# The suite stubs call_model throughout and touches no network, so it is safe
# and fast to run on every push — about two seconds.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest tests/ -v

  # Dev-only tooling: vitest drives the real static/app.js in JSDOM. Nothing
  # here is needed to run the app, which still ships unbundled.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check app.js parses
        run: node --check static/app.js

      - name: Test
        run: npm test
